name: Publish tagged slides to GitHub Pages

on:
  push:
    tags:
      - 'published/*'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || !github.event.deleted
    uses: ./.github/workflows/slides-pages.yml
